<section class="login">
  <div class="card">
    <span class="mark" aria-hidden="true"></span>
    <p class="eyebrow">MathView</p>
    <h1 id="login-title">Acceder</h1>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" aria-labelledby="login-title">
      <div class="field">
        <label for="username">Usuario</label>
        <input id="username" type="text" formControlName="username" autocomplete="username">
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" type="password" formControlName="password" autocomplete="current-password">
      </div>

      <button type="submit" class="btn primary" [disabled]="loginForm.invalid">Entrar</button>
    </form>

    <p *ngIf="errorMessage" class="error" role="alert">{{ errorMessage }}</p>
    <a class="back" routerLink="/">← Volver a las visualizaciones</a>
  </div>
</section>
